<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="{% url 'create_notes' %}">Create notes</a>
    <a href="{% url 'logout'  %}">logout</a>
    <h1>Notes</h1>
    
    {% for note in notes %}
        <p><strong>name</strong> {{note.name}}</p>
        <p><strong>iphone</strong> {{note.phone}}</p>
        <p><strong>created_at</strong> {{note.created_at}}</p>
        <p><strong>update_at</strong> {{note.update_at}}</p>
     <a href="{% url 'delete_notes' note.id %}">Delete notes</a>
    <a href="{% url 'update_notes' note.id %}">Update notes</a>
     
    {% empty %}
        <p>Didnt find any note for u</p>
    {% endfor %}
</body>
</html>
